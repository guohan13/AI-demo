    <title>Case 3 — Client visit</title>
    <script>
      // Opening the source entry directly cannot run TSX; use the standalone build.
      if (location.protocol === 'file:' && /\/case3-client-visit\/index\.html$/.test(location.pathname)) {
        location.replace('./dist/case3-client-visit.html');

    <style>
      html, body { margin: 0; height: 100%; background: #eeedeb; overflow: hidden; }
      .fs-portable {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #eeedeb;
      }
      .fs-portable .ss-fit {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1180px !important;
        max-width: none !important;
        height: 640px !important;
        transform: translate(-50%, -50%) scale(var(--fs-scale, 1));
        transform-origin: center;
      }
      .fs-nav {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        display: flex;
        gap: 8px;
        font: 12px/1.2 ui-sans-serif, system-ui, sans-serif;
      }
      .fs-nav a {
        color: #57534e;
        background: rgba(255,255,255,0.88);
        border: 0.5px solid #d6d3d1;
        border-radius: 8px;
        padding: 6px 10px;
        text-decoration: none;
      }
      .fs-nav a[aria-current="page"] {
        color: #1c1917;
        border-color: #3370ff;
        box-shadow: 0 0 0 1px rgba(51,112,255,0.25);
      }
    </style>
